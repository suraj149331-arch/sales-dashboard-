<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f4f1;--card:#fff;--ink:#16221d;--mute:#5d6b65;--line:#dde3df;--a:#0f6b63;--a2:#e0a100;--up:#13795b;--down:#b3402a;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101714;--card:#18211d;--ink:#e8efeb;--mute:#93a49c;--line:#2a3731;--a:#3cc4b4;--a2:#f0bb2e;--up:#4fd1a1;--down:#f08a74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101714;--card:#18211d;--ink:#e8efeb;--mute:#93a49c;--line:#2a3731;--a:#3cc4b4;--a2:#f0bb2e;--up:#4fd1a1;--down:#f08a74;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);margin:2px 0 0;font-size:14px}
.tools{display:flex;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
button{font:inherit;color:var(--ink);background:none;border:0;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--a);color:#fff}
button:focus-visible{outline:2px solid var(--a2);outline-offset:-2px}
.theme{border:1px solid var(--line);border-radius:8px;background:var(--card)}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.act button{border:1px solid var(--line);border-radius:8px;background:var(--card);font-weight:500}
.act button:first-child{background:var(--a);border-color:var(--a);color:#fff}
.act button:hover{border-color:var(--a)}
#msg{color:var(--mute);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.k .l{color:var(--mute);font-size:13px}
.k .v{font-size:26px;font-weight:700;margin:2px 0;letter-spacing:-.02em}
.d{font-size:13px;font-weight:500}
.d.up{color:var(--up)}.d.down{color:var(--down)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 12px;font-weight:700}
#chart{width:100%;height:auto;display:block}
.bar{margin:0 0 12px}
.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .tr{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .f{height:100%;background:var(--a);border-radius:4px;transition:width .4s}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mute);font-weight:500}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid var(--line)}
.pill.ok{color:var(--up)}.pill.pend{color:var(--a2)}.pill.ret{color:var(--down)}
.note{color:var(--mute);font-size:12px;margin-top:16px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
 <div><h1>Sales dashboard</h1><p class="sub" id="range">Last 30 days</p></div>
 <div class="tools">
  <div class="seg" role="group" aria-label="Date range">
   <button data-r="7" aria-pressed="false">7 days</button>
   <button data-r="30" aria-pressed="true">30 days</button>
   <button data-r="12" aria-pressed="false">12 months</button>
  </div>
  <button class="theme" id="theme" aria-label="Toggle theme">Theme</button>
 </div>
</header>

<div class="act">
 <button id="addSale">Add sale</button>
 <button id="refresh">Refresh data</button>
 <button id="copy">Copy summary</button>
 <span id="msg" role="status" aria-live="polite"></span>
</div>
<section class="kpis" id="kpis"></section>

<section class="grid">
 <div class="card"><h2>Revenue</h2><svg id="chart" viewBox="0 0 640 260" role="img" aria-label="Revenue over time"></svg></div>
 <div class="card"><h2>Sales by category</h2><div id="cats"></div></div>
</section>

<section class="grid" style="grid-template-columns:1fr 1.4fr">
 <div class="card"><h2>Top regions</h2><div class="scroll"><table id="regions"></table></div></div>
 <div class="card"><h2>Recent orders</h2><div class="scroll"><table id="orders"></table></div></div>
</section>
<p class="note">Sample data for demonstration. Replace the numbers in the script with your own sales figures.</p>
</main>

<script>
const inr=n=>"₹"+(n>=1e7?(n/1e7).toFixed(2)+" Cr":n>=1e5?(n/1e5).toFixed(2)+" L":n.toLocaleString("en-IN"));
const D={
 7:{label:"Last 7 days",x:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],y:[182000,210000,195000,240000,268000,310000,285000],k:[1690000,1284,1316,3.4],dk:[8.2,5.1,2.9,0.4]},
 30:{label:"Last 30 days",x:Array.from({length:30},(_,i)=>i+1),y:[],k:[7420000,5612,1322,3.1],dk:[12.4,9.6,2.5,-0.3]},
 12:{label:"Last 12 months",x:["Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct"],y:[5.1,6.8,5.4,5.0,6.2,6.6,6.1,6.9,7.2,7.0,7.9,8.6].map(v=>v*1e6),k:[78800000,61240,1287,3.0],dk:[18.7,14.2,3.9,0.2]}
};
for(let i=0;i<30;i++)D[30].y.push(Math.round(205000+i*3200+Math.sin(i/2.1)*38000+(i%7>4?42000:0)));
const cats=[["Electronics",34],["Fashion",26],["Home & kitchen",19],["Beauty",12],["Grocery",9]];
const regions=[["Mumbai",1820000,14.2],["Delhi NCR",1540000,9.8],["Bengaluru",1390000,11.5],["Pune",860000,6.1],["Ahmedabad",610000,-1.8]];
const orders=[["#10482","Aarav Shah","Wireless earbuds",4999,"ok"],["#10481","Meera Iyer","Cotton kurta set",2350,"ok"],["#10480","Rohan Das","Air fryer",7499,"pend"],["#10479","Sana Khan","Face serum",1299,"ok"],["#10478","Vikram Rao","Smartwatch",8999,"ret"]];
const st={ok:["Paid","ok"],pend:["Pending","pend"],ret:["Returned","ret"]};
const $=s=>document.querySelector(s);
const chg=v=>`<span class="d ${v>=0?"up":"down"}">${v>=0?"▲":"▼"} ${Math.abs(v)}% vs previous</span>`;

function draw(r){
 const d=D[r];$("#range").textContent=d.label;
 const names=["Revenue","Orders","Avg. order value","Conversion"],vals=[inr(d.k[0]),d.k[1].toLocaleString("en-IN"),"₹"+d.k[2].toLocaleString("en-IN"),d.k[3]+"%"];
 $("#kpis").innerHTML=names.map((n,i)=>`<div class="card k"><div class="l">${n}</div><div class="v">${vals[i]}</div>${chg(d.dk[i])}</div>`).join("");
 const W=640,H=260,p={l:52,r:12,t:12,b:28},max=Math.max(...d.y)*1.1,min=0;
 const X=i=>p.l+i*(W-p.l-p.r)/(d.y.length-1),Y=v=>p.t+(1-(v-min)/(max-min))*(H-p.t-p.b);
 let g="";
 for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mute)">${inr(Math.round(v/1000)*1000).replace(/\.\d+/,"")}</text>`}
 const step=Math.ceil(d.x.length/8);
 d.x.forEach((l,i)=>{if(i%step===0)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${l}</text>`});
 const pts=d.y.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
 g+=`<polygon points="${X(0)},${Y(0)} ${pts} ${X(d.y.length-1)},${Y(0)}" fill="var(--a)" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--a)" stroke-width="2.5" stroke-linejoin="round"/>`;
 const mi=d.y.indexOf(Math.max(...d.y));
 g+=`<circle cx="${X(mi)}" cy="${Y(d.y[mi])}" r="5" fill="var(--a2)"/><text x="${Math.min(X(mi),W-60)}" y="${Y(d.y[mi])-10}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Best: ${inr(d.y[mi])}</text>`;
 $("#chart").innerHTML=g;
}
$("#cats").innerHTML=cats.map(c=>`<div class="bar"><div class="t"><span>${c[0]}</span><b>${c[1]}%</b></div><div class="tr"><div class="f" style="width:${c[1]*2.5}%"></div></div></div>`).join("");
$("#regions").innerHTML="<tr><th>Region</th><th class='n'>Revenue</th><th class='n'>Growth</th></tr>"+regions.map(r=>`<tr><td>${r[0]}</td><td class="n">${inr(r[1])}</td><td class="n"><span class="d ${r[2]>=0?"up":"down"}">${r[2]>=0?"+":""}${r[2]}%</span></td></tr>`).join("");
$("#orders").innerHTML="<tr><th>Order</th><th>Customer</th><th>Item</th><th class='n'>Amount</th><th>Status</th></tr>"+orders.map(o=>`<tr><td>${o[0]}</td><td>${o[1]}</td><td>${o[2]}</td><td class="n">₹${o[3].toLocaleString("en-IN")}</td><td><span class="pill ${st[o[4]][1]}">${st[o[4]][0]}</span></td></tr>`).join("");
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));draw(b.dataset.r)});
$("#theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";draw(document.querySelector('.seg [aria-pressed="true"]').dataset.r)};
const cur=()=>document.querySelector('.seg [aria-pressed="true"]').dataset.r;
const say=t=>{$("#msg").textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$("#msg").textContent="",3000)};
function renderOrders(){$("#orders").innerHTML="<tr><th>Order</th><th>Customer</th><th>Item</th><th class='n'>Amount</th><th>Status</th></tr>"+orders.slice(0,6).map(o=>`<tr><td>${o[0]}</td><td>${o[1]}</td><td>${o[2]}</td><td class="n">₹${o[3].toLocaleString("en-IN")}</td><td><span class="pill ${st[o[4]][1]}">${st[o[4]][0]}</span></td></tr>`).join("")}
let oid=10482;
$("#addSale").onclick=()=>{
 const who=["Neha Joshi","Karan Mehta","Isha Nair","Dev Patel","Pooja Singh"],what=[["Running shoes",3499],["Mixer grinder",4299],["Denim jacket",2799],["Bluetooth speaker",1999],["Moisturiser",699]];
 const w=what[Math.floor(Math.random()*what.length)],r=cur();
 orders.unshift(["#"+(++oid),who[Math.floor(Math.random()*who.length)],w[0],w[1],"ok"]);
 D[r].k[0]+=w[1];D[r].k[1]+=1;D[r].y[D[r].y.length-1]+=w[1];
 renderOrders();draw(r);say("Sale added: "+w[0]);
};
$("#refresh").onclick=()=>{
 const r=cur(),d=D[r];
 d.y=d.y.map(v=>Math.round(v*(0.92+Math.random()*0.16)));
 d.k[0]=d.y.reduce((a,b)=>a+b,0);
 draw(r);say("Data refreshed");
};
$("#copy").onclick=async()=>{
 const r=cur(),d=D[r],t=`Sales summary (${d.label}): revenue ${inr(d.k[0])}, ${d.k[1].toLocaleString("en-IN")} orders, avg. order value ₹${d.k[2].toLocaleString("en-IN")}, conversion ${d.k[3]}%.`;
 try{await navigator.clipboard.writeText(t);say("Summary copied")}catch(e){say("Copy is blocked here. Select the numbers manually.")}
};
draw(30);
</script>
</body>
</html>
